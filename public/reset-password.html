<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha - Tec Senai Jardim Colorado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: linear-gradient(135deg, #072a59 0%, #0c4da1 100%);
            padding: 1.5rem;
        }
        .reset-card {
            background: var(--bg-card);
            border-radius: var(--border-radius);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 450px;
            width: 100%;
            padding: 2.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            position: relative;
            z-index: 2;
        }
        .reset-glow {
            width: 300px;
            height: 300px;
            background: var(--accent-gradient);
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.12;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
        }
        .back-link {
            transition: color 0.2s ease;
        }
        .back-link:hover {
            color: #fff !important;
        }
        .form-control-clean::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="reset-glow"></div>
    
    <div class="reset-card">
        <div class="text-center mb-4">
            <a class="fw-bold fs-4 text-decoration-none text-light" href="/">
                <span class="text-gradient">Tec Senai </span>Jardim Colorado
            </a>
            <h1 class="h4 fw-bold mt-3 text-white">Redefinir Senha</h1>
            <p class="text-muted small">Crie uma nova senha segura para sua conta escolar.</p>
        </div>
        
        <!-- Alertas de Status -->
        <div id="statusAlert" class="alert d-none" role="alert"></div>

        <form id="resetForm">
            <div class="mb-3">
                <label class="form-label text-secundary small" for="newPassword">Nova Senha</label>
                <div class="position-relative">
                    <input type="password" class="form-control form-control-clean pe-5 w-100" id="newPassword" placeholder="Mínimo 6 caracteres" required>
                    <button class="position-absolute border-0 p-0" type="button" id="togglePass" style="right: 15px; top: 50%; transform: translateY(-50%); background: transparent; color: var(--text-muted); z-index: 10;">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>
            
            <div class="mb-3">
                <label class="form-label text-secundary small" for="confirmPassword">Confirmar Nova Senha</label>
                <div class="position-relative">
                    <input type="password" class="form-control form-control-clean pe-5 w-100" id="confirmPassword" placeholder="Confirme sua nova senha" required>
                    <button class="position-absolute border-0 p-0" type="button" id="toggleConfirmPass" style="right: 15px; top: 50%; transform: translateY(-50%); background: transparent; color: var(--text-muted); z-index: 10;">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <div class="d-grid mt-4">
                <button type="submit" class="btn btn-modern-primary btn-lg" id="submitBtn">Redefinir Senha</button>
            </div>
        </form>

        <div class="text-center mt-4">
            <a href="/" class="small text-decoration-none back-link" style="color: rgba(255, 255, 255, 0.6); transition: color 0.2s;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='rgba(255, 255, 255, 0.6)'"><i class="bi bi-arrow-left me-1"></i>Voltar para o site</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const resetForm = document.getElementById('resetForm');
            const submitBtn = document.getElementById('submitBtn');
            const statusAlert = document.getElementById('statusAlert');
            
            const newPassword = document.getElementById('newPassword');
            const confirmPassword = document.getElementById('confirmPassword');
            
            // Password Visibility Toggles
            setupPasswordToggle('newPassword', 'togglePass');
            setupPasswordToggle('confirmPassword', 'toggleConfirmPass');
            
            function setupPasswordToggle(inputId, toggleId) {
                const input = document.getElementById(inputId);
                const toggle = document.getElementById(toggleId);
                if (input && toggle) {
                    toggle.addEventListener('click', () => {
                        const isPass = input.type === 'password';
                        input.type = isPass ? 'text' : 'password';
                        toggle.innerHTML = isPass ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
                    });
                }
            }
            
            // Extract token from query parameters
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            
            if (!token) {
                showAlert('Link de redefinição inválido. O token de recuperação está ausente.', 'danger');
                resetForm.classList.add('d-none');
                return;
            }
            
            resetForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const passVal = newPassword.value;
                const confirmVal = confirmPassword.value;
                
                if (passVal.length < 6) {
                    showAlert('A senha deve ter pelo menos 6 caracteres.', 'danger');
                    return;
                }
                
                if (passVal !== confirmVal) {
                    showAlert('As senhas digitadas não coincidem.', 'danger');
                    return;
                }
                
                submitBtn.disabled = true;
                submitBtn.innerText = 'Processando...';
                hideAlert();
                
                try {
                    const response = await fetch('/api/auth/reset-password', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ token, newPassword: passVal })
                    });
                    
                    const data = await response.json();
                    
                    if (!response.ok) {
                        throw new Error(data.error || 'Erro ao redefinir a senha.');
                    }
                    
                    showAlert(data.message || 'Senha redefinida com sucesso!', 'success');
                    resetForm.reset();
                    resetForm.classList.add('d-none');
                    
                    // Show a nice back to login button
                    const card = document.querySelector('.reset-card');
                    const loginContainer = document.createElement('div');
                    loginContainer.className = 'd-grid mt-4';
                    loginContainer.innerHTML = `<a href="/" class="btn btn-modern-primary btn-lg">Fazer Login</a>`;
                    card.insertBefore(loginContainer, resetForm.nextSibling);
                    
                } catch (err) {
                    showAlert(err.message, 'danger');
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'Redefinir Senha';
                }
            });
            
            function showAlert(message, type) {
                statusAlert.innerText = message;
                statusAlert.className = `alert alert-${type} text-center small`;
                statusAlert.classList.remove('d-none');
            }
            
            function hideAlert() {
                statusAlert.classList.add('d-none');
            }
        });
    </script>
</body>
</html>
