<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - Tec Senai Jardim Colorado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: linear-gradient(135deg, #072a59 0%, #0c4da1 100%);
            padding: 1.5rem;
        }
        .recovery-card {
            background: var(--bg-card);
            border-radius: var(--border-radius);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 450px;
            width: 100%;
            padding: 2.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            position: relative;
            z-index: 2;
        }
        .recovery-glow {
            width: 300px;
            height: 300px;
            background: var(--accent-gradient);
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.12;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
        }
        .back-link {
            transition: color 0.2s ease;
        }
        .back-link:hover {
            color: #fff !important;
        }
        .form-control-clean::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="recovery-glow"></div>
    
    <div class="recovery-card">
        <div class="text-center mb-4">
            <a class="fw-bold fs-4 text-decoration-none text-light" href="/">
                <span class="text-gradient">Tec Senai </span>Jardim Colorado
            </a>
            <h1 class="h4 fw-bold mt-3 text-white">Recuperar Senha</h1>
            <p class="text-muted small">Insira seu e-mail escolar cadastrado. Enviaremos as instruções de redefinição de senha.</p>
        </div>
        
        <!-- Alertas de Status -->
        <div id="statusAlert" class="alert d-none" role="alert"></div>

        <form id="recoveryForm">
            <div class="mb-3">
                <label class="form-label text-secundary small" for="recoveryEmail">E-mail Escolar (@aluno.educa.go.gov.br)</label>
                <input type="email" class="form-control form-control-clean w-100" id="recoveryEmail" placeholder="ex: nome.sobrenome@aluno.educa.go.gov.br" required>
            </div>

            <div class="d-grid mt-4">
                <button type="submit" class="btn btn-modern-primary btn-lg" id="submitBtn">Enviar Instruções</button>
            </div>
        </form>

        <div class="text-center mt-4">
            <a href="/" class="small text-decoration-none back-link" style="color: rgba(255, 255, 255, 0.6); transition: color 0.2s;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='rgba(255, 255, 255, 0.6)'"><i class="bi bi-arrow-left me-1"></i>Voltar para o site</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const recoveryForm = document.getElementById('recoveryForm');
            const submitBtn = document.getElementById('submitBtn');
            const statusAlert = document.getElementById('statusAlert');
            const recoveryEmail = document.getElementById('recoveryEmail');
            
            recoveryForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const emailVal = recoveryEmail.value.trim().toLowerCase();
                
                if (!emailVal.endsWith('@aluno.educa.go.gov.br')) {
                    showAlert('Utilize um e-mail escolar válido (@aluno.educa.go.gov.br).', 'danger');
                    return;
                }
                
                submitBtn.disabled = true;
                submitBtn.innerText = 'Processando...';
                hideAlert();
                
                try {
                    const response = await fetch('/api/auth/forgot-password', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ email: emailVal })
                    });
                    
                    const data = await response.json();
                    
                    if (!response.ok) {
                        throw new Error(data.error || 'Erro ao processar solicitação.');
                    }
                    
                    showAlert(data.message || 'Se o e-mail estiver cadastrado, as instruções foram enviadas para seu e-mail escolar.', 'success');
                    recoveryForm.reset();
                    
                } catch (err) {
                    showAlert(err.message, 'danger');
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'Enviar Instruções';
                }
            });
            
            function showAlert(message, type) {
                statusAlert.innerText = message;
                statusAlert.className = `alert alert-${type} text-center small`;
                statusAlert.classList.remove('d-none');
            }
            
            function hideAlert() {
                statusAlert.classList.add('d-none');
            }
        });
    </script>
</body>
</html>
